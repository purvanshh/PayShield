apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: api-pod-failure
  namespace: payshield
spec:
  engineState: active
  appinfo:
    appns: payshield
    applabel: app.kubernetes.io/component=api
    appkind: deployment
  chaosServiceAccount: litmus-admin
  experiments:
    - name: pod-delete
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "60"
            - name: CHAOS_INTERVAL
              value: "10"
            - name: FORCE
              value: "true"
            - name: TARGET_PODS
              value: "1"
        probe:
          - name: api-health-check
            type: httpProbe
            httpProbe/inputs:
              url: http://payshield-api:8000/health
              expectedResponseCode: "200"
            mode: Continuous
            runProperties:
              probeTimeout: 5s
              interval: 2s
              retry: 1
  experimentRun:
    - name: api-pod-failure-run
      spec:
        preRun:
          - name: verify-slos
            type: promql
            promql: slo:availability:ratio_30d
            expectedValue: ">= 0.999"
        postRun:
          - name: verify-slo-recovery
            type: promql
            promql: slo:availability:ratio_30d
            expectedValue: ">= 0.999"
            timeout: 120s
