apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: neo4j-node-drain
  namespace: payshield
spec:
  engineState: active
  appinfo:
    appns: payshield
    applabel: app.kubernetes.io/component=neo4j
    appkind: statefulset
  chaosServiceAccount: litmus-admin
  experiments:
    - name: node-drain
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "120"
            - name: DRAIN_TIMEOUT
              value: "60"
        probe:
          - name: verify-gnn-resumes
            type: cmdProbe
            cmd: python -c "from ml.models.gnn import GNNInference; model = GNNInference(); result = model.predict({'dummy': True})"
            mode: PostChaos
            runProperties:
              probeTimeout: 300s
              interval: 10s
              retry: 30
  experimentRun:
    - name: neo4j-drain-run
      spec:
        preRun:
          - name: verify-neo4j-running
            type: cmdProbe
            cmd: curl -sf http://neo4j:7474
            expectedOutput: ""
        postRun:
          - name: verify-neo4j-restored
            type: cmdProbe
            cmd: curl -sf http://neo4j:7474
            expectedOutput: ""
            timeout: 300s
