# Return-risk rules (Track 02 - Phase 14).
#
# Fed into return_risk/rules_engine.py. Conditions are Python expressions
# evaluated against the flattened feature dict produced by
# return_risk/feature_engine.py (whitelisted builtins only - no injection
# from config). Feature names follow configs/feature_registry_return.yaml,
# with a couple of engine-exposed extras (user_cod_orders, user_is_new,
# txn_amount_risk, txn_time_of_day_risk, merchant_return_rate_30d...).

version: "1.0.0"

rules:
  - rule_id: "R-RULE-01"
    name: "Serial Returner"
    description: "User has returned more than 50% of orders with at least 3 orders"
    condition: "user_serial_returner_flag == True"
    action: "FLAG_FOR_REVIEW"
    severity: 5
    enabled: true

  - rule_id: "R-RULE-02"
    name: "High Value Fashion Return"
    description: "High-value fashion order from user with elevated return rate"
    condition: "float(txn_amount_risk) > 0.3 and float(txn_category_return_baseline) > 0.25 and float(user_return_rate_30d) > 0.20"
    action: "REQUIRE_PREPAID"
    severity: 4
    enabled: true

  - rule_id: "R-RULE-03"
    name: "COD Refusal Pattern"
    description: "User has refused multiple COD deliveries"
    condition: "float(user_cod_refusal_rate) > 0.30 and int(user_cod_orders) > 2"
    action: "BLOCK_COD"
    severity: 4
    enabled: true

  - rule_id: "R-RULE-04"
    name: "Return Velocity Spike"
    description: "User has returned 2+ items in the last 7 days"
    condition: "int(user_return_velocity_7d) >= 2"
    action: "FLAG_FOR_REVIEW"
    severity: 3
    enabled: true

  - rule_id: "R-RULE-05"
    name: "New User High Value"
    description: "New user placing high-value order"
    condition: "bool(user_is_new) and float(txn_amount_risk) > 0.5 and float(txn_category_return_baseline) > 0.20"
    action: "REQUIRE_PREPAID"
    severity: 3
    enabled: true

  - rule_id: "R-RULE-06"
    name: "Merchant Return Rate Elevated"
    description: "Merchant has higher than normal return rate"
    condition: "float(merchant_return_rate_30d) > 0.25"
    action: "FLAG_FOR_REVIEW"
    severity: 2
    enabled: true

  - rule_id: "R-RULE-07"
    name: "Late Night Order"
    description: "Order placed during high-risk hours (11 PM - 5 AM)"
    condition: "float(txn_time_of_day_risk) > 0"
    action: "FLAG_FOR_REVIEW"
    severity: 1
    enabled: true

  - rule_id: "R-RULE-08"
    name: "Low Risk Profile"
    description: "User with consistent low return rate and established history"
    condition: "float(user_return_rate_lifetime) < 0.10 and int(user_total_orders) > 5"
    action: "ACCEPT"
    severity: 1
    enabled: true

risk_tiers:
  LOW:
    max_score: 0.30
    action: "ACCEPT"
  MEDIUM:
    max_score: 0.70
    action: "FLAG_FOR_REVIEW"
  HIGH:
    max_score: 1.00
    action: "REQUIRE_PREPAID"
