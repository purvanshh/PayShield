apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payshield
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/payshield
    targetRevision: HEAD
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: payshield-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
  sync:
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  info:
    - name: Environment
      value: Production
    - name: Documentation
      value: https://docs.payshield.io
