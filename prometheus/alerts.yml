groups:
  - name: payshield-fraud-detection
    rules:
      - alert: L1BlockRateHigh
        expr: rate(layer1_block_total[5m]) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Layer 1 BLOCK rate above 5 txns/min"
          description: "Layer 1 blocked {{ $value }} transactions/min over the last 5 minutes. Possible burst attack."

      - alert: Layer2EscalationSpike
        expr: rate(layer2_escalation_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Layer 2 escalations above 10/min"
          description: "GNN escalations running at {{ $value }}/min. Verify graph hydration health."

      - alert: InferenceLatencyRegression
        expr: |
          sum(rate(inference_latency_seconds_bucket{le="0.1"}[5m])) by (layer)
            / sum(rate(inference_latency_seconds_count[5m])) by (layer) < 0.95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "P95 inference latency exceeding 100ms for layer {{ $labels.layer }}"
          description: "Fewer than 95% of {{ $labels.layer }} inferences complete within 100ms."

      - alert: FraudScoreTailsHigh
        expr: |
          sum(rate(fraud_score_bucket{le="0.95"}[5m]))
            / sum(rate(fraud_score_bucket{le="1.0"}[5m])) < 0.99
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Elevated near-certain fraud scores"
          description: "Over 1% of scored transactions land in the 0.95-1.0 bucket."

      - alert: InvestigationQueueBacklog
        expr: llm_investigation_queue_depth > 50
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "LLM investigation queue backlog"
          description: "Queue depth at {{ $value }}. LLM worker may be down or saturated."
