apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - patch-replicas.yaml

configMapGenerator:
  - name: payshield-config
    behavior: merge
    literals:
      - LOG_LEVEL=INFO

images:
  - name: payshield/api
    newTag: staging
  - name: payshield/celery-worker
    newTag: staging

namespace: payshield-staging
