apiVersion: batch/v1
kind: CronJob
metadata:
  name: validate-backups
  labels:
    app.kubernetes.io/name: payshield
    app.kubernetes.io/component: backup
spec:
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: validator
              image: payshield/backup-tools:latest
              imagePullPolicy: Always
              command:
                - /bin/bash
                - -c
                - |
                  ./dr/monitor-backup-status.sh
              env:
                - name: S3_BUCKET
                  value: s3://payshield-backups
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "128Mi"
                  cpu: "200m"
              volumeMounts:
                - name: backup-scripts
                  mountPath: /dr
                  readOnly: true
          volumes:
            - name: backup-scripts
              configMap:
                name: backup-scripts
                defaultMode: 0755
