apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-postgres
  labels:
    app.kubernetes.io/name: payshield
    app.kubernetes.io/component: backup
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: payshield-backup-sa
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: payshield/backup-tools:latest
              imagePullPolicy: Always
              command:
                - /bin/bash
                - -c
                - |
                  ./dr/backup-postgres.sh
                  ./dr/backup-config.sh
              env:
                - name: PGHOST
                  value: postgres
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: payshield-secrets
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: payshield-secrets
                      key: POSTGRES_PASSWORD
                - name: S3_BUCKET
                  value: s3://payshield-backups
                - name: BACKUP_DIR
                  value: /backups
                - name: RETENTION_DAYS
                  value: "30"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "250m"
                limits:
                  memory: "1Gi"
                  cpu: "1000m"
              volumeMounts:
                - name: backup-scripts
                  mountPath: /dr
                  readOnly: true
                - name: backup-data
                  mountPath: /backups
          volumes:
            - name: backup-scripts
              configMap:
                name: backup-scripts
                defaultMode: 0755
            - name: backup-data
              emptyDir: {}
---
