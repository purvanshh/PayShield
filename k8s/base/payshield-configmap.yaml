apiVersion: v1
kind: ConfigMap
metadata:
  name: payshield-config
  labels:
    app.kubernetes.io/name: payshield
    app.kubernetes.io/component: config
data:
  LOG_LEVEL: "INFO"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  WS_HOST: "0.0.0.0"
  WS_PORT: "8765"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "payshield"
  CORS_ORIGINS: "*"
  RATE_LIMIT_PER_MINUTE: "60"
  BATCH_SIZE: "1000"
  CACHE_TTL_SECONDS: "300"
  MODEL_CACHE_SIZE: "10"
  ENSEMBLE_STRATEGY: "weighted_voting"
  CONFIDENCE_THRESHOLD: "0.7"
  ENABLE_LLM_INVESTIGATOR: "true"
  ENABLE_WEBSOCKET: "true"
  ENABLE_METRICS: "true"
  INVESTIGATION_QUEUE_MAXSIZE: "1000"
  PYTHONUNBUFFERED: "1"
