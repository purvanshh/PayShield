apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - payshield-configmap.yaml
  - payshield-sealed-secret.yaml
  - payshield-deployment.yaml
  - payshield-service.yaml
  - payshield-ingress.yaml
  - payshield-hpa.yaml
  - celery-deployment.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - postgres-statefulset.yaml
  - postgres-service.yaml
  - network-policies.yaml
  - pod-disruption-budgets.yaml

commonLabels:
  app.kubernetes.io/name: payshield
  app.kubernetes.io/managed-by: kustomize

namespace: payshield
