[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "payshield"
version = "1.0.0"
description = "Real-Time UPI Fraud Detection & Graph-Powered Investigation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "redis>=5.0.0",
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
    "networkx>=3.2.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "ollama>=0.1.0",
    "shap>=0.44.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
