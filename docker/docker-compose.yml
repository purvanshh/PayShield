version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - store_data:/app/store/audit_logs
      - store_data:/app/store/feedback
      - explanations_data:/app/models/production/explanations
      - compliance_reports_data:/app/compliance/reports
    environment:
      - REDIS_HOST=redis
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-pay-shield-dev-aes256-key-0001}
      - ENFORCE_RBAC=true
      - DATA_REGION=IN
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  redis_data:
  store_data:
  explanations_data:
  compliance_reports_data: