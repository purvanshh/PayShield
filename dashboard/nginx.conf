server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: client-side paths (/, /login, /return-risk, /chargeback,
    # /investigation/:txnId) must fall back to index.html; only real files
    # (assets, favicon) are served directly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built assets are content-hashed: cache aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}